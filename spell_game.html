<body style="background-image: url('comic-pattern.png'); background-size: cover; background-repeat: no-repeat;">
    <header>
        <h1 class="head">Spellathon</h1>
        <br>
        
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="twist-in-a-tale.html">Twist in a Tale</a></li>
                <li><a href="genre-story-game.html">Genre Jumble</a></li>

                <li><a href="spell_game.html">Spellathon</a></li>
            </ul>
        </nav>
    </header>

    <div class="twist-game-section">
        <h2>Spell the Word</h2>
        <div>
            <label for="level">Select Level: </label>
            <input type="range" id="level" min="1" max="10" value="1" step="1" />
        </div>
        <div id="level-display">Level: 1</div>
        <button class="submit">Start</button>
        <p id="word-to-spell" style="display: none;"></p> <!-- Hide the word display -->
        <input type="text" id="user-input" placeholder="Type the word here..." />
        <div class="button-container">
            <button class="submit">Submit</button>
            <button class="submit" title="Repeat Word">🔊</button>
        </div>
        <p id="result"></p>
        <p id="score">Score: 0</p>
    </div>

    <footer>
        <p>&copy; 2024 Twist in a Tale</p>
    </footer>

    <script>
        const wordLevels = {
        1: ["cat", "dog", "hat", "bat", "rat", "cow", "pig", "owl"],
        2: ["apple", "banana", "grape", "peach", "mango", "pear", "plum", "berry"],
        3: ["orange", "kiwi", "cherry", "lemon", "lime", "melon", "fig", "apricot"],
        4: ["wonder", "beautiful", "mountain", "ocean", "sunrise", "valley", "forest", "river"],
        5: ["enthusiasm", "incredible", "perception", "adventure", "imagination", "creativity", "dedication", "exploration"],
        6: ["mysterious", "phenomenon", "extraordinary", "discovery", "curiosity", "puzzle", "breakthrough", "observation"],
        7: ["unbelievable", "consequence", "acquaintance", "exhilarating", "remarkable", "association", "surprising", "astounding"],
        8: ["unpredictable", "incompatibility", "exasperating", "transformative", "contradiction", "adaptation", "frustrating", "evolutionary"],
        9: ["extraordinary", "responsibility", "contemporary", "incomprehensible", "visionary", "complicated", "exceptional", "challenging"],
        10: ["misunderstanding", "disproportionate", "characteristically", "unquestionable", "unfathomable", "overwhelming", "philosophically", "extraordinarily"],

};

let currentWord = '';
let score = 0;

// Function to speak the word
function speakWord(word) {
    const utterance = new SpeechSynthesisUtterance(word);
    utterance.rate = 0.5; // Slow speech
    window.speechSynthesis.speak(utterance);
}

// Function to get a random word based on the current level
function getRandomWord() {
    const level = document.getElementById("level").value;
    const words = wordLevels[level];
    return words[Math.floor(Math.random() * words.length)];
}

// Function to start the game
function startGame() {
    currentWord = getRandomWord();
    document.getElementById("word-to-spell").innerText = currentWord; // Show the word to spell
    document.getElementById("user-input").value = ''; // Clear previous input
    document.getElementById("user-input").style.display = 'block'; // Show the input field
    document.getElementById("result").innerText = ''; // Clear previous result
    document.getElementById("word-to-spell").style.display = 'none'; // Show the word to spell
    speakWord(currentWord); // Speak the word
}

// Function to check the user's answer
function checkAnswer() {
    const userInput = document.getElementById("user-input").value;
    if (userInput.toLowerCase() === currentWord) {
        score += 1; // Increase score
        document.getElementById("result").innerText = 'Correct!';
    } else {
        document.getElementById("result").innerText = 'Wrong! The correct word was: ' + currentWord;
        score = 0; // Reset score if wrong
    }
    document.getElementById("score").innerText = 'Score: ' + score; // Update score display
    currentWord = getRandomWord(); // Get a new word
    document.getElementById("word-to-spell").innerText = currentWord; // Show the new word
    document.getElementById("user-input").value = ''; // Clear input field
    speakWord(currentWord);
}

// Add event listeners to buttons
document.querySelector(".submit").addEventListener("click", startGame);
document.querySelectorAll(".submit")[1].addEventListener("click", checkAnswer);

// Update level display when the range input changes
document.getElementById("level").addEventListener("input", function () {
    document.getElementById("level-display").innerText = 'Level: ' + this.value; // Update level display
});

// Hide the word display initially
document.getElementById("word-to-spell").style.display = 'none';


// Event listener for the repeat button
document.querySelector(".button-container button[title='Repeat Word']").addEventListener("click", () => {
    speakWord(currentWord);
});

    </script>
