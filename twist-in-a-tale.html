        async function copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
                console.log("Text copied to clipboard:", text);
            } catch (err) {
                console.error("Failed to copy text:", err);
            }
        }

        // Call the copy function when the page loads
        window.onload = function() {
            const textToCopy = "Once upon a time in a lush green forest, there lived a boastful hare and a humble tortoise. The hare, known for his speed, often mocked the tortoise for being slow. Tired of the hare's constant bragging, the tortoise challenged him to a race. Amused by the idea, the hare accepted, confident that he would easily win. As the race began, the hare darted ahead, leaving the tortoise far behind. Certain of his victory, the hare decided to take a nap under a shady tree, thinking he had plenty of time. Meanwhile, the tortoise continued to plod along steadily, his determination unwavering. As the tortoise approached the finish line, the hare woke up, realizing he had overslept. Panicking, he sprinted toward the finish line, but the tortoise was already crossing it, a look of triumph on his face. The animals of the forest cheered for the tortoise, celebrating his victory. However, in this twist of fate, as the tortoise basked in his win, he suddenly felt an overwhelming fatigue. It turned out that the tortoise had been so focused on the race that he had forgotten to eat and rest properly. As he celebrated, he collapsed from exhaustion, and the hare, realizing what had happened, rushed to his side.Instead of gloating, the hare offered to help the tortoise recover. Together, they sought out some fruits and water to rejuvenate the tortoise. As they spent time together, they shared stories and discovered that they had much more in common than they had previously thought.In the end, the tortoise learned the importance of balance in life, and the hare realized that true friendship was worth more than any race. They became the best of friends, often racing together for fun, but this time with no pressure to win. The forest echoed with laughter and joy as they raced side by side, reminding everyone that it’s not always about who finishes first, but about the journey and the friends we make along the way.";
